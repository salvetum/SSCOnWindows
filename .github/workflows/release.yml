name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build + publish release artifacts
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply btstack logging patch (cosmetic; optional)
        shell: bash
        run: |
          git -C extern/btstack apply ../../patches/btstack-win-usb-logs.patch 2>/dev/null || echo "patch skipped (already applied / incompatible)"

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build_msvc -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build CLI (SSCOnWindows-0.1.exe; includes wxWidgets FetchContent)
        shell: pwsh
        run: cmake --build build_msvc --config Release --target A2DPWB -j 2

      - uses: microsoft/setup-msbuild@v2

      - name: Build WinUI 3 GUI
        shell: pwsh
        run: |
          msbuild "winui3\A2DPWBWinUI.vcxproj" -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -m:2

      - name: Stage release payload (no proprietary blob / firmware)
        shell: pwsh
        run: |
          $dist = 'dist\SSCOnWindows-0.1'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item 'build_msvc\app\Release\SSCOnWindows-0.1.exe' $dist -Force
          Copy-Item 'winui3\bin\x64\Release\*' $dist -Recurse -Force
          Copy-Item README.md, LICENSE, THIRD_PARTY_LICENSES.md $dist -Force
          Compress-Archive -Path "$dist\*" -DestinationPath "dist\SSCOnWindows-0.1.zip" -Force
          Get-FileHash "dist\SSCOnWindows-0.1.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content "dist\SSCOnWindows-0.1.zip.sha256" -Encoding ascii

      - name: Create GitHub Release (draft)
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "dist\SSCOnWindows-0.1.zip" "dist\SSCOnWindows-0.1.zip.sha256" ``
            --repo "${{ github.repository }}" --draft `
            --title "SSC On Windows ${{ github.ref_name }}" `
            --notes "Binaries only. The proprietary Samsung SSC blob is NOT distributed; see README / THIRD_PARTY_LICENSES.md."
        env:
          GH_TOKEN: ${{ github.token }}