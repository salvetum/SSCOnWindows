name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format (changed app/src files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Collect changed core source files
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            git ls-tree -r --name-only HEAD > all.txt
          else
            git diff --name-only --no-renames "$base" HEAD -- app/src > all.txt
          fi
          : > files.txt
          while IFS= read -r f; do
            case "$f" in
              app/src/*.cpp|app/src/*.c|app/src/*.h) printf '%s\n' "$f" >> files.txt ;;
            esac
          done < all.txt
      - name: Format check (clang-format -i must be a no-op)
        shell: bash
        run: |
          readarray -t files < files.txt
          if [ ${#files[@]} -eq 0 ]; then
            echo "no changed core sources to lint"
            exit 0
          fi
          clang-format -i --style=file "${files[@]}"
          if ! git diff --quiet --exit-code -- app/src; then
            echo "::error::clang-format wants changes in:"
            git diff --name-only -- app/src
            git diff --stat -- app/src
            exit 1
          fi
          echo "clang-format: clean"